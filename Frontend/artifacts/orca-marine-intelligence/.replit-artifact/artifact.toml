kind = "web"
previewPath = "/"
title = "ORCA Marine Ecosystem Intelligence"
description = "A polished demo marine intelligence dashboard for Smart India Hackathon 2026, combining marine conditions, potential fishing zones, risk analysis, route planning, alerts, interactive maps, explainable recommendations, and an AI assistant."
version = "1.0.0"
id = "artifacts/orca-marine-intelligence"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24962

[services.development]
run = "pnpm --filter @workspace/orca-marine-intelligence run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orca-marine-intelligence", "run", "build" ]
serve = "static"
publicDir = "artifacts/orca-marine-intelligence/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24962"
BASE_PATH = "/"
